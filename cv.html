.hero-meta a{color:var(--muted);text-decoration:none;border-bottom:1px solid transparent;transition:color .2s,border-color .2s}
.hero-meta a:hover{color:var(--accent);border-color:var(--accent)}
.hero-cta{margin-top:40px;display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 26px;border-radius:999px;font-size:.92rem;text-decoration:none;transition:all .25s;letter-spacing:.02em}

.sec-line{flex:1;height:1px;background:var(--line);transform:translateY(-6px)}

.edu::before{content:'';position:absolute;left:calc(var(--t) + var(--a)/2);top:8px;bottom:8px;width:1px;background:var(--line)}

.edu-body h3{font-family:var(--font-display);font-size:1.3rem;font-weight:600;line-height:1.3}
.edu-body h3 .en{color:var(--muted);font-size:.72em;font-weight:400;margin-left:10px}
.edu-degree{color:var(--accent);font-weight:500;font-size:.95rem;margin-top:4px}

.row:first-of-type{border-top:0}

.fade-swap{animation:fadeUp .35s ease both}
@media (prefers-reduced-motion:reduce){

  html{scroll-behavior:auto}

  renderHero(D);
  renderEducation(D);
  renderExperience(D);
  renderProjects(D);
  renderCampus(D);
  renderSkills(D);
  renderContact(D);

  main.classList.remove('fade-swap');
  void main.offsetWidth;
  main.classList.add('fade-swap');
}

document.querySelectorAll('.lang-btn').forEach(function (b) {
  b.addEventListener('click', function () {
    var l = b.getAttribute('data-lang');
    if (l === state.lang) return;
    state.lang = l;
    try { localStorage.setItem('resume-lang', l); } catch (e) {}
    apply();
  });
});

var navToggle = document.getElementById('navToggle');
var navLinks = document.getElementById('navLinks');
navToggle.addEventListener('click', function () {
  var open = navLinks.classList.toggle('open');
  navToggle.classList.toggle('open', open);
  navToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
});
navLinks.addEventListener('click', function (e) {
  if (e.target.tagName === 'A') {
    navLinks.classList.remove('open');
    navToggle.classList.remove('open');
    navToggle.setAttribute('aria-expanded', 'false');
  }
});
